            <section id="ContactMe">

                <div class="contactFormArea">

                    <h2>Have a question?  Send me a message. </h2>
                    <form id="contactForm">
                        <label >Name</label>
                        <div id="nameError"></div>
                        <input type="text" placeholder="Your Name" id="name">

                        <label>Email</label>
                        <div id="emailError"></div>
                        <input type="email" placeholder="Your Email" id="email">

                        <label>Subject</label>
                        <div id="subjectError"></div>
                        <input type="text" placeholder="Subject" id="subject">

                        <label>Message</label>
                        <div id="messageError"></div>
                        <textarea placeholder="Your Message" id="message"></textarea>

                        <label id="attachmentArea">Attachment</label>
                        <input type="file" id="attachment">
 
                        <button type="submit">Submit</button>
                        <div id="alertMessage"></div>
                    </form>   
                    
                </div>

        <script>
            const form = document.getElementById("contactForm"); 
  

            form.addEventListener("submit", function(event) {
                event.preventDefault(); 

                const name = document.getElementById("name").value.trim(); 
                const email = document.getElementById("email").value.trim(); 
                const subject = document.getElementById("subject").value.trim();
                const message = document.getElementById("message").value.trim(); 

                document.getElementById("nameError").textContent = "";
                document.getElementById("emailError").textContent = "";
                document.getElementById("subjectError").textContent = "";
                document.getElementById("messageError").textContent = "";                

                if (name === "") {
                    document.getElementById("nameError").textContent ="Please enter your name."; 
                }

                if (email === "") {
                    document.getElementById("emailError").textContent = "Please enter your email."; 
                }else if (!email.includes("@")) {
                    document.getElementById("emailError").textContent = "Please enter an correct email."; 
                    }

                if (subject === "") {
                    document.getElementById("subjectError").textContent = "Please enter the subject."; 
                }

                if (message === "") {
                    document.getElementById("messageError").textContent = "Please enter your message."; 
                    return;
                }

                if (name !== "" && email !== "" && email.includes("@") && message !== "") {
                    alertMessage.textContent = "Message sent successfully!";
                }
            });        

        </script>
