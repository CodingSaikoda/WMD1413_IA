<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="card">
        <h1>Task Tracker</h1>
        <p class="subtitle">Keep your day organized.</p>

        <form id="task-form">
          <input id="task-input" type="text" placeholder="Add a new task" required />
          <button type="submit">Add</button>
        </form>

        <div class="toolbar">
          <span id="task-count">0 tasks</span>
          <button id="clear-completed" type="button">Clear completed</button>
        </div>

        <ul id="task-list"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
