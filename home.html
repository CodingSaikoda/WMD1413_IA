        <script>

        window.addEventListener("scroll", () => {
        const left1 = document.querySelector(".leftText1");

        const right1 = document.querySelector(".rightText1");
        const right2 = document.querySelector(".rightText2");

            if (window.scrollY > 100) {

            if (window.scrollY > 200) {
            left2.classList.add("show");
            right2.classList.add("show");
            }
        });
